[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/shell",
    "crates/ai",
    "crates/integrations",
    "crates/app",
    "apps/d0-spike",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["reznikov73"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
